<section appSectionSpy="stack" class="section-shell">
  <h2 class="section-title m-0 mb-2">03 — Compétences</h2>
  <p class="m-0 mb-12 max-w-[46ch] font-sans text-base leading-[1.6] font-medium text-bone/60">
    Les outils que j'utilise au quotidien, classés par domaine.
  </p>

  <div class="flex flex-col gap-10">
    @for (group of groups; track group.label) {
      <div class="border-t border-accent/40 pt-4">
        <h3 class="m-0 mb-4 font-sans text-[11px] font-bold leading-none tracking-[0.08em] text-accent uppercase">
          {{ group.label }}
        </h3>
        <div class="flex flex-wrap gap-3">
          @for (item of group.items; track trackItem($index, item)) {
            <div
              class="group flex items-center gap-2.5 rounded-md border border-bone/10 bg-bone/5 px-3.5 py-2 transition-colors duration-200 hover:border-accent/40 hover:bg-accent/5"
            >
              @if (item.logo) {
                <img
                  [src]="item.logo"
                  [alt]="item.name + ' logo'"
                  width="18"
                  height="18"
                  class="h-[18px] w-[18px] object-contain opacity-80 transition-opacity duration-200 group-hover:opacity-100"
                  loading="lazy"
                />
              }
              <span class="font-mono text-[13px] font-medium leading-none text-bone/75 transition-colors duration-200 group-hover:text-bone">
                {{ item.name }}
              </span>
            </div>
          }
        </div>
      </div>
    }
  </div>
</section>
